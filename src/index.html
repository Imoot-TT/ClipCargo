<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCargo</title>
  <link rel="icon" href="./assets/clipcargo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./design/tokens.css?v=20261127-2">
  <link rel="stylesheet" href="./styles.css?v=20261127-10">
  <script src="./link-utils.js?v=20261109-4" defer></script>
  <script src="./api/tauri.js?v=20261127-1" defer></script>
  <script src="./components/tooltip.js?v=20261127-1" defer></script>
  <script src="./state/jobs.js?v=20261127-1" defer></script>
  <script src="./state/workspace.js?v=20261127-1" defer></script>
  <script src="./components/view-tabs.js?v=20261127-1" defer></script>
  <script src="./components/selection-bar.js?v=20261127-1" defer></script>
  <script src="./components/inspector.js?v=20261127-1" defer></script>
  <script src="./components/confirm-panel.js?v=20261127-1" defer></script>
  <script src="./components/drawer.js?v=20261127-1" defer></script>
  <script src="./views/inbox.js?v=20261127-1" defer></script>
  <script src="./views/library.js?v=20261127-1" defer></script>
  <script src="./views/tasks.js?v=20261127-1" defer></script>
  <script src="./views/settings.js?v=20261127-1" defer></script>
  <script src="./views/studio.js?v=20261127-2" defer></script>
  <script src="./app.js?v=20261127-10" defer></script>
</head>
<body>
  <div class="app-shell">
    <header id="app-titlebar" class="app-titlebar" data-tauri-drag-region>
      <div class="titlebar-brand" data-tauri-drag-region>
        <img class="titlebar-mark" src="./assets/clipcargo-mark.png" alt="">
        <span class="titlebar-name">ClipCargo</span>
        <span class="titlebar-tag">Workspace 2.0</span>
      </div>
      <button id="global-search-trigger" class="global-search-trigger" type="button" aria-haspopup="dialog" aria-controls="command-palette">
        <span class="ui-icon" style="--icon:url('./assets/icons/search.svg')" aria-hidden="true"></span>
        <span class="global-search-copy">搜索素材、项目、命令，或直接粘贴 HTTP(S) 链接…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="titlebar-actions">
        <button id="editor-status-pill" class="editor-status-pill" type="button" title="查看剪辑软件导入设置">
          <span class="status-dot" aria-hidden="true"></span><span id="editor-status-text">正在发现剪映 Pro…</span>
        </button>
        <div class="window-controls" role="group" aria-label="窗口控制">
          <button id="window-minimize" class="window-control" type="button" aria-label="最小化" title="最小化"><span class="ui-icon" style="--icon:url('./assets/icons/minus.svg')" aria-hidden="true"></span></button>
          <button id="window-maximize" class="window-control" type="button" aria-label="最大化或还原" title="最大化或还原"><span class="ui-icon" style="--icon:url('./assets/icons/square.svg')" aria-hidden="true"></span></button>
          <button id="window-close" class="window-control close" type="button" aria-label="关闭" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button>
        </div>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-top">
          <nav aria-label="主导航">
            <button class="nav-item active" data-view="inbox" aria-label="收集箱"><span class="nav-icon" style="--icon:url('./assets/icons/inbox.svg')" aria-hidden="true"></span><span class="nav-label">收集箱</span><span id="inbox-count" class="nav-count accent">0</span></button>
            <button class="nav-item" data-view="library" aria-label="素材库"><span class="nav-icon" style="--icon:url('./assets/icons/library.svg')" aria-hidden="true"></span><span class="nav-label">素材库</span><span id="library-count" class="nav-count">0</span></button>
            <button class="nav-item" data-view="tasks" aria-label="任务队列"><span class="nav-icon" style="--icon:url('./assets/icons/list-checks.svg')" aria-hidden="true"></span><span class="nav-label">任务队列</span><span id="task-count" class="nav-count warning">0</span></button>
          </nav>
          <section class="project-tree-section" aria-labelledby="project-tree-title">
            <div class="project-tree-header"><span id="project-tree-title">项目工作区</span><button class="sidebar-icon-button" type="button" data-action="manage-projects" aria-label="新建或管理项目" title="新建或管理项目"><span class="ui-icon" style="--icon:url('./assets/icons/plus.svg')" aria-hidden="true"></span></button></div>
            <div id="sidebar-project-tree" class="sidebar-project-tree"></div>
          </section>
        </div>
        <div class="sidebar-bottom">
          <button id="mini-task-capsule" class="mini-task-capsule" type="button" data-view="tasks">
            <span class="mini-task-heading"><strong id="mini-task-label">队列空闲</strong><span id="mini-task-speed">就绪</span></span>
            <span class="mini-task-track"><span id="mini-task-progress" style="width:100%"></span></span>
          </button>
          <div class="sidebar-status-row">
            <button id="extension-heartbeat" class="extension-heartbeat" type="button" title="查看浏览器扩展状态"><span class="heartbeat-dot" aria-hidden="true"></span><span id="extension-heartbeat-text">正在检查扩展…</span></button>
            <button class="settings-entry" type="button" data-view="browser"><span class="ui-icon" style="--icon:url('./assets/icons/settings.svg')" aria-hidden="true"></span>设置</button>
          </div>
        </div>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="command-palette" class="command-palette-backdrop" role="presentation" hidden>
    <section class="command-palette" role="dialog" aria-modal="true" aria-labelledby="command-palette-title">
      <div class="command-palette-input-row">
        <span class="ui-icon" style="--icon:url('./assets/icons/search.svg')" aria-hidden="true"></span>
        <label id="command-palette-title" class="sr-only" for="command-palette-input">全局搜索与命令</label>
        <input id="command-palette-input" type="text" autocomplete="off" placeholder="搜索素材、执行命令，或粘贴 HTTP(S) 链接…">
        <kbd>Esc</kbd>
      </div>
      <div id="command-palette-results" class="command-palette-results" role="listbox"></div>
    </section>
  </div>
  <div id="dialog-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog add-link-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-header"><h2 id="dialog-title">添加链接</h2><button id="dialog-close" class="icon-button" aria-label="关闭" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <label class="field-label" for="url-input">分享文案或页面链接</label>
      <textarea id="url-input" rows="4" aria-describedby="url-summary form-error" placeholder="粘贴分享文案或视频页面链接…"></textarea>
      <div id="url-summary" class="input-summary" aria-live="polite">自动提取 HTTP(S) 链接，最多 100 条</div>
      <label class="field-label" for="project-input">项目</label>
      <div id="project-combobox" class="project-combobox">
        <div class="project-combobox-field">
          <input id="project-input" class="field-control" type="text" maxlength="50" value="未分类" placeholder="选择已有项目或输入新项目" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="project-options">
          <button id="project-toggle" class="project-combobox-toggle" type="button" tabindex="-1" aria-label="展开项目列表"><span class="ui-icon" style="--icon:url('./assets/icons/chevron-right.svg')" aria-hidden="true"></span></button>
        </div>
        <div id="project-options" class="project-combobox-menu" role="listbox" hidden></div>
      </div>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="dialog-cancel" class="button">取消</button><button id="import-button" class="button primary">加入收集</button></div>
    </section>
  </div>
  <div id="project-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog project-dialog" role="dialog" aria-modal="true" aria-labelledby="project-dialog-title">
      <div class="dialog-header"><h2 id="project-dialog-title">项目管理</h2><button id="project-close" class="icon-button" aria-label="关闭项目管理" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <form id="project-create-form" class="project-create-form">
        <label class="field-label" for="new-project-name">新项目</label>
        <div class="inline-create"><input id="new-project-name" class="field-control" maxlength="50" placeholder="输入项目名称"><button class="button primary" type="submit"><span class="ui-icon" style="--icon:url('./assets/icons/plus.svg')" aria-hidden="true"></span>创建</button></div>
      </form>
      <p id="project-error" class="form-error" role="alert"></p>
      <div id="project-list" class="project-list"></div>
    </section>
  </div>
  <div id="download-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="download-title">
      <div class="dialog-header"><h2 id="download-title">准备下载</h2><button id="download-close" class="icon-button" aria-label="关闭下载设置" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <div id="download-summary" class="download-summary"></div>
      <div id="download-exceptions" class="download-exceptions"></div>
      <label class="field-label" for="download-preset">保存格式</label>
      <select id="download-preset" class="field-control"><option value="package">完整素材包</option><option value="video">兼容 MP4</option><option value="source">保留来源格式</option><option value="audio">只要音频（MP3）</option></select>
      <label id="download-quality-label" class="field-label" for="download-quality">清晰度</label>
      <select id="download-quality" class="field-control"><option value="1080" selected>最高 1080p</option><option value="720">最高 720p</option><option value="best">最佳可用</option></select>
      <details class="download-more"><summary>更多保存选项</summary><label id="download-subtitles-row" class="check-row"><input id="download-subtitles" type="checkbox"><span><strong>保存字幕文件</strong><small>有字幕时保存独立 VTT，没有字幕不影响视频下载</small></span></label><div id="download-subtitle-options" class="subtitle-options" hidden></div><div class="download-extras"><label id="download-retain-source-row"><input id="download-retain-source" type="checkbox" checked>同时保留原格式</label><label><input id="download-cover" type="checkbox">保存封面</label><label title="在素材旁保存原页面链接和标题，方便以后查找"><input id="download-source-record" type="checkbox" checked>保存来源信息</label></div></details>
      <p id="download-quality-note" class="inline-note">实际结果取决于来源提供的格式，不会放大低分辨率视频。</p>
      <p id="download-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="download-component-action" class="button" data-action="download-components" hidden>安装所需工具</button><button id="download-cancel" class="button">取消</button><button id="download-submit" class="button primary">开始下载</button></div>
    </section>
  </div>
  <div id="inbox-detail-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog detail-dialog" role="dialog" aria-modal="true" aria-labelledby="inbox-detail-title">
      <div class="dialog-header"><h2 id="inbox-detail-title">条目详情</h2><button id="inbox-detail-close" class="icon-button" aria-label="关闭条目详情" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <form id="inbox-detail-form">
        <label class="field-label" for="inbox-detail-name">显示标题</label>
        <input id="inbox-detail-name" class="field-control" maxlength="512" required>
        <label class="field-label" for="inbox-detail-project">项目</label>
        <select id="inbox-detail-project" class="field-control"></select>
        <dl id="inbox-detail-meta" class="detail-meta"></dl>
        <p id="inbox-detail-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button id="inbox-detail-source" class="button" type="button">打开来源</button><button id="inbox-detail-primary" class="button" type="button"></button><button id="inbox-detail-cancel" class="button" type="button">取消</button><button class="button primary" type="submit">保存</button></div>
      </form>
    </section>
  </div>
  <div id="batch-move-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="batch-move-title">
      <div class="dialog-header"><h2 id="batch-move-title">移动所选条目</h2><button id="batch-move-close" class="icon-button" aria-label="关闭移动面板" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <label class="field-label" for="batch-move-project">目标项目</label>
      <select id="batch-move-project" class="field-control"></select>
      <p id="batch-move-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="batch-move-cancel" class="button">取消</button><button id="batch-move-submit" class="button primary">移动到项目</button></div>
    </section>
  </div>
  <div id="media-edit-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="media-edit-title">
      <div class="dialog-header"><h2 id="media-edit-title">整理素材</h2><button id="media-edit-close" class="icon-button" aria-label="关闭素材编辑" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <form id="media-edit-form">
        <label class="field-label" for="media-edit-name">显示名称</label>
        <input id="media-edit-name" class="field-control" maxlength="512" required>
        <label class="field-label" for="media-edit-project">项目</label>
        <select id="media-edit-project" class="field-control"></select>
        <p class="inline-note">修改显示名称不会更改硬盘文件名；移动项目不会搬动文件。</p>
        <p id="media-edit-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button id="media-edit-cancel" class="button" type="button">取消</button><button class="button primary" type="submit">保存</button></div>
      </form>
    </section>
  </div>
  <div id="local-import-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="local-import-title">
      <div class="dialog-header"><h2 id="local-import-title">导入本地素材</h2><button id="local-import-close" class="icon-button" aria-label="关闭本地导入" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <p id="local-import-summary" class="input-summary"></p>
      <label class="field-label" for="local-import-project">项目</label>
      <select id="local-import-project" class="field-control"></select>
      <fieldset class="import-mode-options"><legend>文件管理方式</legend>
        <label><input type="radio" name="local-import-mode" value="copy" checked><span><strong>复制到 ClipCargo</strong><small>占用额外空间；可由 ClipCargo 移到回收站</small></span></label>
        <label><input type="radio" name="local-import-mode" value="reference"><span><strong>仅引用原文件</strong><small>不复制；原文件移动后需要重新定位，ClipCargo 不会删除它</small></span></label>
      </fieldset>
      <p id="local-import-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="local-import-cancel" class="button">取消</button><button id="local-import-submit" class="button primary">导入</button></div>
    </section>
  </div>
  <div id="component-install-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog component-install-dialog" role="dialog" aria-modal="true" aria-labelledby="component-install-title">
      <div class="dialog-header"><div><h2 id="component-install-title">安装工具</h2><p id="component-install-purpose" class="dialog-subtitle"></p></div><button id="component-install-close" class="icon-button" aria-label="关闭安装确认" title="关闭"><span class="ui-icon" style="--icon:url('./assets/icons/x.svg')" aria-hidden="true"></span></button></div>
      <dl class="install-summary">
        <div><dt>预计下载</dt><dd id="component-install-download"></dd></div>
        <div><dt>安装后占用</dt><dd id="component-install-size"></dd></div>
        <div><dt>来源</dt><dd id="component-install-source"></dd></div>
        <div><dt>安装位置</dt><dd id="component-install-path"></dd></div>
      </dl>
      <p class="dialog-note">下载完成后会核对 SHA-256，并在版本自检通过后启用；校验失败不会替换现有版本。</p>
      <p id="component-install-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="component-install-cancel" class="button">取消</button><button id="component-install-confirm" class="button primary"><span class="ui-icon" style="--icon:url('./assets/icons/download.svg')" aria-hidden="true"></span>确认下载并安装</button></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-message"></span><button id="toast-action" class="button compact" type="button" hidden></button></div>
  <div id="drop-overlay" class="drop-overlay" hidden><span class="drop-icon ui-icon" style="--icon:url('./assets/icons/package-open.svg')" aria-hidden="true"></span><strong>释放以导入本地素材</strong><span>视频或音频会复制到 ClipCargo 素材目录</span></div>
</body>
</html>
