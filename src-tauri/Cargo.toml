[package]
name = "clipcargo"
version = "0.1.4"
description = "ClipCargo desktop application"
authors = ["Imoot-TT"]
edition = "2021"
default-run = "clipcargo"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = ["protocol-asset", "tray-icon"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[bin]]
name = "clipcargo"
path = "src/main.rs"

[[bin]]
name = "clipcargo-native-host"
path = "src/bin/native_host.rs"
