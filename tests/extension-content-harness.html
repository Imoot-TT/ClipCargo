<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClipCargo 扩展浮标测试</title>
  <style>
    body { margin: 0; padding: 88px 32px 32px; background: #f4f5f8; font: 14px "Segoe UI", sans-serif; }
    .sticky-cover { position: fixed; z-index: 2147483646; inset: 0 0 auto; height: 58px; display: flex; align-items: center; padding: 0 32px; background: #fff; box-shadow: 0 2px 12px rgba(25,30,45,.13); font-weight: 700; }
    #add-card { margin-bottom: 20px; padding: 8px 12px; border: 1px solid #d9dce5; border-radius: 8px; background: #fff; cursor: pointer; }
    #grid { display: grid; grid-template-columns: repeat(2, 320px); gap: 24px; }
    article { margin: 0; }
    .thumbnail { position: relative; width: 320px; height: 180px; display: block; overflow: hidden; border-radius: 14px; background: linear-gradient(135deg,#6b79e8,#1d253f); }
    .thumbnail.small { width: 180px; height: 102px; }
    .thumbnail img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .preview-overlay { position: absolute; z-index: 2147483646; inset: 0; display: grid; place-items: center; background: rgba(14,18,32,.68); color: #fff; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .12s ease; }
    .thumbnail:hover .preview-overlay { opacity: 1; pointer-events: auto; }
    h2 { margin: 9px 0 0; font-size: 15px; }
  </style>
</head>
<body>
  <div class="sticky-cover">模拟媒体站点吸顶导航</div>
  <button id="add-card" type="button">添加动态视频</button>
  <main id="grid">
    <article><a class="thumbnail" href="https://www.youtube.com/watch?v=alpha" aria-label="演示视频 Alpha"><img alt="演示视频 Alpha"><span class="preview-overlay">模拟网站 hover 预览层</span></a><h2>演示视频 Alpha</h2></article>
    <article><a class="thumbnail" href="https://www.youtube.com/shorts/beta" aria-label="演示视频 Beta"><img alt="演示视频 Beta"></a><h2>演示视频 Beta</h2></article>
  </main>
  <script src="/tests/extension-content-mock.js"></script>
  <script src="/extension/content.js"></script>
</body>
</html>
