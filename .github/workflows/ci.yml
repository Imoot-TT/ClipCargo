name: ClipCargo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify version contract
        run: npm run check:release
      - name: Check JavaScript syntax
        run: >-
          node --check src/app.js &&
          node --check src/api/tauri.js &&
          node --check src/components/tooltip.js &&
          node --check src/state/jobs.js &&
          node --check src/link-utils.js &&
          node --check extension/background.js &&
          node --check extension/popup.js &&
          node --check extension/content.js
      - name: Run static contract checks
        run: node tests/verify-static.mjs
      - name: Run link analysis smoke test
        run: node tests/link-analysis-smoke.mjs
      - name: Run extension queue smoke test
        run: node tests/extension-queue-smoke.mjs
      - name: Run command contract smoke test
        run: node tests/command-contract-smoke.mjs
      - name: Run Rust tests
        run: npm run check:rust
      - name: Package store extension
        run: npm run package:store-extension
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipcargo-extension-${{ github.sha }}
          path: reports/package/*-store.zip
          if-no-files-found: error
