name: ClipCargo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify version contract
        run: npm run check:release
      - name: Run source and extension checks
        run: npm run check:source
      - name: Run Rust tests
        run: npm run check:rust
      - name: Package store extension
        run: npm run package:store-extension
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipcargo-extension-${{ github.sha }}
          path: reports/package/*-store.zip
          if-no-files-found: error
