name: ClipCargo Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify release version
        run: npm run check:release -- -ExpectedVersion "${{ github.ref_name }}"
      - name: Run release checks
        run: npm run check
      - name: Build Windows installer
        run: npm run bundle:win
      - name: Package Chrome Web Store extension
        run: npm run package:store-extension
      - name: Create checksums
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'clipcargo-release'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File | Copy-Item -Destination $output -Force
          Get-ChildItem -Path 'reports/package/*-store.zip' -File | Copy-Item -Destination $output -Force
          Get-ChildItem -LiteralPath $output -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ASCII (Join-Path $output 'SHA256SUMS.txt')
          "RELEASE_DIR=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath $env:RELEASE_DIR -File | ForEach-Object { $_.FullName })
          gh release create "${{ github.ref_name }}" $assets --title "ClipCargo ${{ github.ref_name }}" --generate-notes
